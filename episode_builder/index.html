<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Episode Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#15161a;
    --panel:#1c1e24;
    --panel-2:#22242b;
    --border:#2e313a;
    --text:#e7e6e2;
    --text-dim:#8b8d96;
    --accent:#e8a33d;
    --accent-dim:#8a662c;
    --cam:#5aa9e6;
    --danger:#d3564a;
    --ok:#5fb383;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;}
  button{font-family:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);border-radius:4px;padding:6px 10px;}
  button:hover{border-color:var(--accent-dim);}
  button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600;}
  button.primary:hover{filter:brightness(1.08);}
  button.danger{color:var(--danger);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input,select{font-family:inherit;font-size:12px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:4px;padding:5px 7px;width:100%;}
  input[type=checkbox]{width:auto;}
  label.field{display:block;margin:8px 0;}
  label.field span{display:block;color:var(--text-dim);font-size:11px;margin-bottom:3px;
    text-transform:uppercase;letter-spacing:.04em;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);
    margin:16px 0 8px;font-weight:600;}
  h3:first-child{margin-top:0;}

  #app{display:grid;grid-template-columns:250px 1fr 320px;grid-template-rows:1fr auto;
    height:100vh;gap:1px;background:var(--border);}
  #topbar{grid-column:1/4;background:var(--panel);padding:10px 14px;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  #topbar .brand{font-weight:700;color:var(--accent);letter-spacing:.02em;margin-right:6px;}
  #topbar .tb-field{display:flex;align-items:center;gap:6px;}
  #topbar .tb-field span{color:var(--text-dim);font-size:11px;}
  #topbar input,#topbar select{width:auto;min-width:90px;}

  #sidebar{background:var(--panel);overflow-y:auto;padding:10px;}
  #elementList{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .el-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:5px;
    border:1px solid transparent;background:var(--panel-2);cursor:pointer;}
  .el-item:hover{border-color:var(--border);}
  .el-item.active{border-color:var(--accent);background:#2a2313;}
  .el-item .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .el-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .el-item .del{opacity:.5;font-size:11px;}
  .el-item .del:hover{opacity:1;color:var(--danger);}

  #canvasWrap{position:relative;overflow:auto;background:
    repeating-conic-gradient(#1a1b1f 0% 25%, #17181c 0% 50%) 50% / 22px 22px;
    display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;background:#000;overflow:hidden;box-shadow:0 0 0 1px var(--border);}
  #stageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;}
  #stageBg.empty{display:flex;align-items:center;justify-content:center;color:var(--text-dim);}

  .cam-rect{position:absolute;border:2px solid var(--cam);background:rgba(90,169,230,.08);
    cursor:move;}
  .cam-rect::after{content:'';position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;
    background:var(--cam);border-radius:2px;cursor:nwse-resize;}

  .sprite-drag{position:absolute;cursor:move;border:2px solid var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.4);}
  .sprite-drag img{display:block;width:100%;height:100%;object-fit:contain;
    background:rgba(232,163,61,.08);}
  .sprite-drag .tag{position:absolute;top:-20px;left:-2px;background:var(--accent);
    color:#1a1408;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px 3px 0 0;
    white-space:nowrap;}
  .sprite-ghost{position:absolute;border:1px dashed var(--text-dim);opacity:.5;pointer-events:none;}

  .decor-preview{position:absolute;pointer-events:none;opacity:.55;
    border:1px dashed var(--ok);box-shadow:0 0 0 1px rgba(0,0,0,.3);}
  .decor-preview img{display:block;width:100%;height:100%;object-fit:contain;}
  .decor-preview .tag{position:absolute;top:-18px;left:-1px;background:var(--ok);
    color:#0e1a12;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px 3px 0 0;
    white-space:nowrap;opacity:.9;}

  #inspector{background:var(--panel);overflow-y:auto;padding:12px;}
  .placeholder{color:var(--text-dim);font-size:12px;padding:20px 4px;line-height:1.6;}
  .segList{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px;}
  .seg-row{display:flex;align-items:center;gap:6px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:5px;padding:6px 8px;}
  .seg-row.active{border-color:var(--accent);}
  .seg-row .lbl{flex:1;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .seg-row button{padding:2px 7px;font-size:11px;}
  .move-block{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:10px;
    background:var(--panel-2);}
  .move-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .move-head b{font-size:11px;color:var(--accent);}
  .segment-editor{border:1px solid var(--accent-dim);border-radius:6px;padding:10px;
    margin-top:8px;background:#211c10;}
  .segment-editor h4{margin:0 0 8px;font-size:11px;color:var(--accent);
    text-transform:uppercase;letter-spacing:.05em;}
  .check-row{display:flex;gap:14px;margin:8px 0;flex-wrap:wrap;}
  .check-row label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin:4px 0 10px;}
  .btnbar{display:flex;gap:6px;margin-top:8px;}
  .coord-readout{font-family:var(--mono);font-size:12px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:4px;padding:6px 8px;margin:6px 0;}

  #bottombar{grid-column:1/4;background:var(--panel);border-top:1px solid var(--border);
    padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  #bottombar .status{font-size:11px;color:var(--text-dim);font-family:var(--mono);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
    align-items:center;justify-content:center;z-index:5000;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:20px;width:360px;}
  .modal h3{margin-top:0;}
  .modal .btnbar{justify-content:flex-end;margin-top:16px;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="brand">EPISODE BUILDER</span>
    <button id="btnImport">📂 Importer un episode-settings.json</button>
    <input type="file" id="importFileInput" accept=".json,application/json" class="hidden">
    <label class="tb-field"><span>episode_id</span>
      <input id="f_episode_id" placeholder="episode-xxx" style="width:170px"></label>
    <label class="tb-field"><span>output filename</span>
      <input id="f_output_filename" placeholder="episode-xxx.mp4" style="width:170px"></label>
    <label class="tb-field"><span>durée (s)</span>
      <input id="f_duration" type="number" step="0.5" style="width:70px"></label>
    <label class="tb-field"><span>fps</span>
      <input id="f_fps" type="number" style="width:55px"></label>
    <label class="tb-field"><span>résolution</span>
      <input id="f_res_w" type="number" style="width:70px">
      <span>×</span>
      <input id="f_res_h" type="number" style="width:70px"></label>
    <label class="tb-field"><span>background</span>
      <select id="f_background" style="width:170px"></select></label>
    <label class="tb-field"><span>audio</span>
      <select id="f_audio" style="width:190px"></select></label>
  </div>

  <div id="sidebar">
    <h3>Éléments</h3>
    <div id="elementList"></div>
    <button id="btnAddCharacter" style="width:100%">+ Ajouter un personnage</button>
    <button id="btnAddDecor" style="width:100%;margin-top:6px">+ Ajouter un décor</button>
    <button id="btnAddTextDecor" style="width:100%;margin-top:6px">+ Ajouter un titre / texte</button>
  </div>

  <div id="canvasWrap">
    <div id="stage">
      <div id="stageBg" class="empty"></div>
      <!-- overlays injected here -->
    </div>
  </div>

  <div id="inspector">
    <div id="inspectorContent">
      <div class="placeholder">Sélectionne la caméra ou un personnage dans la liste à gauche
        pour éditer ses segments.</div>
    </div>
  </div>

  <div id="bottombar">
    <span class="status" id="statusLine">Prêt.</span>
    <button class="primary" id="btnGenerate">Générer episode-settings.json</button>
  </div>

</div>

<div id="saveModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Enregistrer l'episode</h3>
    <label class="field"><span>Nom du fichier (dans episodes/episodes-settings/)</span>
      <input id="saveFilename" placeholder="episode-xxx-settings.json"></label>
    <div class="btnbar">
      <button id="saveCancel">Annuler</button>
      <button class="primary" id="saveConfirm">Enregistrer</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================== ÉTAT GLOBAL ============================== */

const STAGE_W = 900; // largeur d'affichage du stage à l'écran (px CSS)
let RES = [1920, 1080];
let scaleFactor = STAGE_W / RES[0];

const state = {
  episode_id: "",
  output: { filename: "", duration_seconds: 10, fps: 24, resolution: [1920, 1080] },
  background: { image: "" },
  audio: "",
  camera: {
    zoom: 1.0, x: RES[0] / 2, y: RES[1] / 2,
    timeline: [{ at_second: 0.0, zoom: 1.0, x: RES[0] / 2, y: RES[1] / 2 }]
  },
  characters: [],
  decors: []
};

let selection = { type: null, index: null };      // {type:'camera'} | {type:'character', index}
let cameraKeyIndex = 0;                             // keyframe caméra en cours d'édition
let characterCache = {};                            // nom -> data /api/character/<name>
let charactersAvailable = [];
let decorCache = {};                                // nom -> data /api/decor/<name>
let decorsAvailable = [];
let fontsAvailable = [];                            // fichiers .ttf/.otf dans fonts/
let draftSegment = null;                            // segment en cours d'édition (avant "Enregistrer")
let draftEmotion = null;                            // keyframe d'emotion_timeline en cours d'édition
let draftEffect = null;                             // effet de décor en cours d'édition

/* ============================== UTILS ============================== */

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(children)) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  return e;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function setStatus(msg) { document.getElementById("statusLine").textContent = msg; }
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function newCharacterId(charName) {
  let n = 1;
  let id = charName;
  const used = new Set(state.characters.map(c => c.id));
  while (used.has(id)) { n += 1; id = charName + "-" + n; }
  return id;
}

function newDecorId(decorName) {
  let n = 1;
  let id = decorName;
  const used = new Set(state.decors.map(d => d.id));
  while (used.has(id)) { n += 1; id = decorName + "-" + n; }
  return id;
}

/* ============================== CHARGEMENT INITIAL ============================== */

async function loadInitialData() {
  try {
    const chars = await api("/api/characters");
    charactersAvailable = chars.characters;
  } catch (e) { setStatus("Erreur /api/characters: " + e.message); }

  try {
    const decs = await api("/api/decors");
    decorsAvailable = decs.decors;
  } catch (e) { setStatus("Erreur /api/decors: " + e.message); }

  try {
    const fonts = await api("/api/fonts");
    fontsAvailable = fonts.fonts;
  } catch (e) { setStatus("Erreur /api/fonts: " + e.message); }

  try {
    const bgs = await api("/api/backgrounds");
    const sel = document.getElementById("f_background");
    sel.innerHTML = "<option value=''>—</option>" +
      bgs.backgrounds.map(b => `<option value="${b}">${b}</option>`).join("");
  } catch (e) { setStatus("Erreur /api/backgrounds: " + e.message); }

  try {
    const auds = await api("/api/episodes-audio");
    const sel = document.getElementById("f_audio");
    sel.innerHTML = "<option value=''>—</option>" +
      auds.audios.map(a => `<option value="${a}">${a}</option>`).join("");
  } catch (e) { setStatus("Erreur /api/episodes-audio: " + e.message); }

  // Personnage par défaut si la liste est vide
  if (state.characters.length === 0 && charactersAvailable.length > 0) {
    await addCharacter(charactersAvailable[0]);
  }
  renderAll();
}

async function getCharacterData(name) {
  if (characterCache[name]) return characterCache[name];
  const data = await api("/api/character/" + encodeURIComponent(name));
  characterCache[name] = data;
  return data;
}

async function getDecorData(name) {
  if (decorCache[name]) return decorCache[name];
  const data = await api("/api/decor/" + encodeURIComponent(name));
  decorCache[name] = data;
  return data;
}

/* ============================== IMPORT D'UN EPISODE-SETTINGS.JSON EXISTANT ============================== */

function normalizeSegment(seg) {
  const out = {
    position: String(seg.position ?? "1"),
    from: { x: Number(seg.from?.x ?? 0), y: Number(seg.from?.y ?? 0) },
    to: { x: Number(seg.to?.x ?? 0), y: Number(seg.to?.y ?? 0) },
    duration_seconds: Number(seg.duration_seconds ?? 1.5),
    skip_transition: !!seg.skip_transition,
    reverse: !!seg.reverse,
    flip_x: !!seg.flip_x,
  };
  // gaze est un champ conditionnel : on ne le porte que s'il était présent
  if (seg.gaze && typeof seg.gaze === "object") {
    out.gaze = { x: Number(seg.gaze.x ?? 0), y: Number(seg.gaze.y ?? 0) };
  }
  return out;
}

function normalizeEmotionKeyframe(ek) {
  const out = { at_second: Number(ek.at_second ?? 0) };
  // eyes/mouth sont des champs conditionnels : on ne les porte que s'ils étaient présents
  if (ek.eyes) out.eyes = ek.eyes;
  if (ek.mouth) out.mouth = ek.mouth;
  return out;
}

function normalizeCharacter(c) {
  return {
    id: c.id || (c.character || "char"),
    character: c.character || "",
    position: String(c.position ?? "1"),
    layer: Number(c.layer ?? 0),
    screen_position: { x: Number(c.screen_position?.x ?? 0), y: Number(c.screen_position?.y ?? 0) },
    scale: Number(c.scale ?? 1.0),
    overlay_scale: Number(c.overlay_scale ?? 1.0),
    flip_x: !!c.flip_x,
    emotions: { eyes: c.emotions?.eyes || "HAPPY", mouth: c.emotions?.mouth || "HAPPY" },
    emotion_timeline: (c.emotion_timeline || []).map(normalizeEmotionKeyframe),
    speaker: c.speaker || "",
    gaze: { x: Number(c.gaze?.x ?? 0), y: Number(c.gaze?.y ?? 0) },
    moves: (c.moves || []).map(mv => ({
      at_second: Number(mv.at_second ?? 0),
      transition_fps: Number(mv.transition_fps ?? 8),
      move_fps: Number(mv.move_fps ?? 10),
      segments: (mv.segments || []).map(normalizeSegment)
    })),
    dialogue: c.dialogue ?? null
  };
}

function normalizeEffect(e) {
  const type = ["scale", "fade", "slide"].includes(e.type) ? e.type : "fade";
  const out = {
    type,
    start_second: Number(e.start_second ?? 0),
    duration_seconds: (e.duration_seconds === undefined || e.duration_seconds === null)
      ? null : Number(e.duration_seconds),
    from: Number(e.from ?? (type === "scale" ? 1.0 : 0.0)),
    to: Number(e.to ?? (type === "slide" ? 0.0 : 1.0)),
    easing: e.easing || "linear"
  };
  if (type === "slide") out.axis = e.axis === "y" ? "y" : "x";
  return out;
}

function normalizeDecor(d) {
  const type = d.type === "text" ? "text" : "image";
  const out = {
    id: d.id || (type === "text" ? "texte" : (d.decor || "decor")),
    type,
    screen_position: { x: Number(d.screen_position?.x ?? 0), y: Number(d.screen_position?.y ?? 0) },
    scale: Number(d.scale ?? 1.0),
    flip_x: !!d.flip_x,
    layer: Number(d.layer ?? 0),
    active_window: (d.active_window && d.active_window.duration_seconds != null) ? {
      start_second: Number(d.active_window.start_second ?? 0),
      duration_seconds: Number(d.active_window.duration_seconds)
    } : null,
    effects: Array.isArray(d.effects) ? d.effects.map(normalizeEffect) : []
  };
  if (type === "text") {
    out.text = d.text || "";
    out.font = {
      file: d.font?.file || "",
      size: Number(d.font?.size ?? 48),
      color: (Array.isArray(d.font?.color) && d.font.color.length === 4)
        ? d.font.color.map(Number) : [255, 255, 255, 255]
    };
    out.align = d.align === "center" ? "center" : "left";
  } else {
    out.decor = d.decor || "";
    out.color = d.color || "GREEN";
  }
  return out;
}

async function importEpisodeSettings(json) {
  if (!json || typeof json !== "object") throw new Error("JSON invalide");

  const resolution = Array.isArray(json.output?.resolution) && json.output.resolution.length === 2
    ? json.output.resolution.map(Number) : [1920, 1080];

  state.episode_id = json.episode_id || "";
  state.output = {
    filename: json.output?.filename || "",
    duration_seconds: Number(json.output?.duration_seconds ?? 10),
    fps: Number(json.output?.fps ?? 24),
    resolution
  };
  RES = resolution;
  state.background = { image: json.background?.image || "" };
  state.audio = json.audio || "";

  const camSrc = json.camera || {};
  let timeline = Array.isArray(camSrc.timeline) ? camSrc.timeline.map(kf => ({
    at_second: Number(kf.at_second ?? 0), zoom: Number(kf.zoom ?? 1),
    x: Number(kf.x ?? RES[0] / 2), y: Number(kf.y ?? RES[1] / 2)
  })) : [];
  if (timeline.length === 0) {
    timeline = [{ at_second: 0, zoom: Number(camSrc.zoom ?? 1), x: Number(camSrc.x ?? RES[0] / 2), y: Number(camSrc.y ?? RES[1] / 2) }];
  }
  state.camera = { zoom: Number(camSrc.zoom ?? 1), x: Number(camSrc.x ?? RES[0] / 2), y: Number(camSrc.y ?? RES[1] / 2), timeline };

  state.characters = (json.characters || []).map(normalizeCharacter);

  // précharge les character-settings.json des personnages utilisés (aperçus sprites)
  const names = [...new Set(state.characters.map(c => c.character).filter(Boolean))];
  await Promise.all(names.map(n => getCharacterData(n).catch(() => null)));

  state.decors = (json.decors || []).map(normalizeDecor);
  const decorNames = [...new Set(state.decors.map(d => d.decor).filter(Boolean))];
  await Promise.all(decorNames.map(n => getDecorData(n).catch(() => null)));

  selection = { type: "camera", index: null };
  cameraKeyIndex = 0;
  draftSegment = null;
  draftEmotion = null;
  draftEffect = null;

  rebuildStageSize();
  refreshTopbarFields();
  renderAll();
}

document.getElementById("btnImport").addEventListener("click", () => {
  document.getElementById("importFileInput").click();
});
document.getElementById("importFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = ""; // permet de réimporter le même fichier plus tard
  if (!file) return;
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    await importEpisodeSettings(json);
    setStatus("Importé : " + file.name);
  } catch (err) {
    setStatus("Erreur d'import : " + err.message);
    alert("Impossible d'importer ce fichier : " + err.message);
  }
});

/* ============================== TOPBAR BINDING ============================== */

function bindTopbar() {
  const map = [
    ["f_episode_id", () => state.episode_id, v => state.episode_id = v],
    ["f_output_filename", () => state.output.filename, v => state.output.filename = v],
    ["f_duration", () => state.output.duration_seconds, v => state.output.duration_seconds = parseFloat(v) || 0],
    ["f_fps", () => state.output.fps, v => state.output.fps = parseInt(v) || 24],
  ];
  for (const [id, getter, setter] of map) {
    const inp = document.getElementById(id);
    inp.value = getter();
    inp.addEventListener("input", () => setter(inp.value));
  }
  document.getElementById("f_res_w").value = RES[0];
  document.getElementById("f_res_h").value = RES[1];
  document.getElementById("f_res_w").addEventListener("input", (e) => {
    RES[0] = parseInt(e.target.value) || RES[0];
    state.output.resolution = [RES[0], RES[1]];
    rebuildStageSize(); renderStage();
  });
  document.getElementById("f_res_h").addEventListener("input", (e) => {
    RES[1] = parseInt(e.target.value) || RES[1];
    state.output.resolution = [RES[0], RES[1]];
    rebuildStageSize(); renderStage();
  });
  document.getElementById("f_background").addEventListener("change", (e) => {
    state.background.image = e.target.value;
    renderStage();
  });

function rebuildStageSize() {

function ensureOption(selectEl, value) {

/* ---- Bascule le type d'un décor existant (image <-> texte), en conservant
   les champs communs (id, screen_position, scale, flip_x, layer, active_window, effects) ---- */
function switchDecorType(d, newType) {
  if (d.type === newType) return;
  d.type = newType;
  if (newType === "text") {
    delete d.decor; delete d.color;
    d.text = d.text || "Nouveau texte";
    d.font = d.font || { file: "", size: 48, color: [255, 255, 255, 255] };
    d.align = d.align || "left";
  } else {
    delete d.text; delete d.font; delete d.align;
    d.decor = decorsAvailable[0] || "";
    d.color = "GREEN";
    if (d.decor) {
      getDecorData(d.decor).then(data => {
        d.color = Object.keys(data.colors)[0] || "GREEN";
        renderAll();
      }).catch(() => {});
    }
  }
}

/* ============================== FONTS (CSS Font Loading API, pour l'aperçu) ============================== */

const loadedFontFamilies = {}; // fichier -> nom de famille CSS déjà chargé

async function ensureFontLoaded(fontFile) {
  if (!fontFile) return null;
  if (loadedFontFamilies[fontFile]) return loadedFontFamilies[fontFile];
  const family = "df-" + fontFile.replace(/[^a-zA-Z0-9]/g, "_");
  try {
    const url = "/api/file?path=" + encodeURIComponent("fonts/" + fontFile);
    const face = new FontFace(family, `url(${url})`);
    await face.load();
    document.fonts.add(face);
    loadedFontFamilies[fontFile] = family;
    return family;
  } catch (e) {
    return null; // police introuvable/illisible : on retombe sur une police système
  }
}

/* ============================== STAGE (canvas central) ============================== */

function renderStage() {
  const bgEl = document.getElementById("stageBg");
  if (state.background.image) {
    bgEl.className = "";
    bgEl.style.backgroundImage = `url(/api/file?path=${encodeURIComponent("episodes/images/" + state.background.image)})`;
    bgEl.style.backgroundSize = "cover";
    bgEl.style.backgroundPosition = "center";
    bgEl.textContent = "";
  } else {
    bgEl.className = "empty";
    bgEl.style.backgroundImage = "";
    bgEl.textContent = "Choisis une background image en haut →";
  }

  // nettoie les overlays précédents (les aperçus de décors gèrent leur propre nettoyage)
  document.querySelectorAll(".cam-rect,.sprite-drag,.sprite-ghost").forEach(n => n.remove());

  // aperçu permanent de tous les décors déjà placés (non-interactif, sauf celui sélectionné)
  renderAllDecors();

  if (selection.type === "camera") renderCameraOverlay();
  else if (selection.type === "character") renderCharacterOverlay();
  else if (selection.type === "decor") renderDecorOverlay();
}

function px(v) { return (v * scaleFactor) + "px"; }

function renderCameraOverlay() {
  const kf = state.camera.timeline[cameraKeyIndex];
  if (!kf) return;
  const stage = document.getElementById("stage");
  // taille du rectangle = fenêtre visible à ce zoom (résolution / zoom), centrée sur x,y
  const rectW = RES[0] / kf.zoom;
  const rectH = RES[1] / kf.zoom;
  const left = kf.x - rectW / 2;
  const top = kf.y - rectH / 2;

  const rect = el("div", { class: "cam-rect" });
  rect.style.left = px(left); rect.style.top = px(top);
  rect.style.width = px(rectW); rect.style.height = px(rectH);
  stage.appendChild(rect);

  makeDraggable(rect, {
    onMove: (dxPx, dyPx) => {
      kf.x = clamp(kf.x + dxPx / scaleFactor, 0, RES[0]);
      kf.y = clamp(kf.y + dyPx / scaleFactor, 0, RES[1]);
      const w = RES[0] / kf.zoom, h = RES[1] / kf.zoom;
      rect.style.left = px(kf.x - w / 2); rect.style.top = px(kf.y - h / 2);
      refreshInspector();
    },
    onResize: (dxPx, dyPx) => {
      const curW = RES[0] / kf.zoom;
      const newW = clamp(curW + dxPx / scaleFactor, 40, RES[0] * 2);
      kf.zoom = clamp(RES[0] / newW, 0.2, 6);
      const w = RES[0] / kf.zoom, h = RES[1] / kf.zoom;
      rect.style.left = px(kf.x - w / 2); rect.style.top = px(kf.y - h / 2);
      rect.style.width = px(w); rect.style.height = px(h);
      refreshInspector();
    }
  });
}

function renderCharacterOverlay() {
  const c = state.characters[selection.index];
  if (!c) return;
  // Segment en édition prioritaire ; sinon état initial du personnage
  if (draftSegment) {
    renderDraggableSprite(c, draftSegment.position, draftSegment.to, draftSegment.flip_x,
      (nx, ny) => { draftSegment.to.x = nx; draftSegment.to.y = ny; refreshInspector(); },
      "segment (to)");
  } else {
    renderDraggableSprite(c, c.position, c.screen_position, c.flip_x,
      (nx, ny) => { c.screen_position.x = nx; c.screen_position.y = ny; refreshInspector(); },
      "état initial");
  }
}

const spriteDimsCache = {}; // preview_url -> {w, h} en pixels natifs
function loadImageNaturalSize(url) {
  if (spriteDimsCache[url]) return Promise.resolve(spriteDimsCache[url]);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const dims = { w: img.naturalWidth, h: img.naturalHeight };
      spriteDimsCache[url] = dims;
      resolve(dims);
    };
    img.onerror = () => resolve({ w: 160, h: 240 }); // fallback si l'image ne charge pas
    img.src = url;
  });
}

async function renderDraggableSprite(c, position, posObj, flipX, onMove, tag) {
  const stage = document.getElementById("stage");
  let data;
  try { data = await getCharacterData(c.character); } catch (e) { return; }
  const posData = data.positions[position];
  const previewUrl = posData && posData.idle && posData.idle.preview_url;

  // Dimensions réelles du sprite (pixels natifs, non scalés) : la boîte doit
  // représenter l'empreinte exacte que produira le rendu final (image native × scale).
  const dims = previewUrl ? await loadImageNaturalSize(previewUrl) : { w: 160, h: 240 };

  // évite les doublons si l'utilisateur a changé de sélection entre-temps
  if (!(selection.type === "character" && state.characters[selection.index] === c)) return;
  document.querySelectorAll(".sprite-drag").forEach(n => n.remove());

  const w = dims.w * (c.scale || 1);
  const h = dims.h * (c.scale || 1);

  const box = el("div", { class: "sprite-drag" });
  box.style.left = px(posObj.x); box.style.top = px(posObj.y);
  box.style.width = px(w); box.style.height = px(h);
  box.style.zIndex = "2000"; // toujours au-dessus des aperçus de décors (z-index 10+layer)
  if (flipX) box.style.transform = "scaleX(-1)";
  box.appendChild(el("div", { class: "tag" },
    `${c.character} · pos ${position} · ${tag} · ${Math.round(w)}×${Math.round(h)}px`));
  if (previewUrl) {
    box.appendChild(el("img", { src: previewUrl, draggable: "false" }));
  } else {
    box.appendChild(el("div", {
      style: "width:100%;height:100%;display:flex;align-items:center;justify-content:center;" +
             "color:var(--text-dim);font-size:11px;text-align:center;padding:6px;"
    }, "pas d'aperçu idle disponible pour cette position"));
  }
  stage.appendChild(box);

  makeDraggable(box, {
    onMove: (dxPx, dyPx) => {
      posObj.x = Math.round(clamp(posObj.x + dxPx / scaleFactor, -w, RES[0]));
      posObj.y = Math.round(clamp(posObj.y + dyPx / scaleFactor, -h, RES[1]));
      onMove(posObj.x, posObj.y);
      box.style.left = px(posObj.x); box.style.top = px(posObj.y);
    }
  });
}

/* ---- Aperçu (approximatif) d'un décor texte : DOM + police réelle chargée en tâche de fond ---- */
function buildTextPreviewNode(d) {
  const box = document.createElement("div");
  box.style.position = "absolute";
  box.style.whiteSpace = "pre";
  box.style.lineHeight = "1.15";
  box.style.fontWeight = "700";
  box.style.fontFamily = "sans-serif";
  const color = (d.font && Array.isArray(d.font.color)) ? d.font.color : [255, 255, 255, 255];
  box.style.color = `rgba(${color[0]},${color[1]},${color[2]},${(color[3] ?? 255) / 255})`;
  box.style.fontSize = px(d.font?.size || 48);
  box.textContent = d.text || "";
  if (d.align === "center") {
    box.style.left = "50%";
    box.style.transform = "translateX(-50%)";
  } else {
    box.style.left = px(d.screen_position.x);
  }
  box.style.top = px(d.screen_position.y);
  return box;
}
function applyTextPreviewFont(box, d) {
  ensureFontLoaded(d.font?.file).then(family => {
    box.style.fontFamily = family ? `"${family}", sans-serif` : "sans-serif";
  });
}

// Aperçu permanent de TOUS les décors placés dans l'episode (pas seulement celui sélectionné).
// Le décor actuellement sélectionné n'est pas dupliqué ici : il reste géré (interactif,
// draggable) par renderDecorOverlay(). Les autres sont affichés en semi-transparent,
// non-interactifs (pointer-events:none), pour servir de repère visuel de composition.
async function renderAllDecors() {
  document.querySelectorAll(".decor-preview").forEach(n => n.remove());
  const stage = document.getElementById("stage");

  for (let i = 0; i < state.decors.length; i++) {
    const d = state.decors[i];
    const isSelected = selection.type === "decor" && selection.index === i;
    if (isSelected) continue; // rendu (interactif) par renderDecorOverlay()

    if (d.type === "text") {
      const box = buildTextPreviewNode(d);
      box.classList.add("decor-preview");
      box.style.zIndex = String(10 + (d.layer || 0));
      box.appendChild(el("div", { class: "tag" }, `texte · ${d.id}`));
      stage.appendChild(box);
      applyTextPreviewFont(box, d);
      continue;
    }

    if (!d.decor) continue;

    let data;
    try { data = await getDecorData(d.decor); } catch (e) { continue; }

    // l'état a pu changer pendant l'attente (sélection, suppression, etc.)
    if (state.decors[i] !== d) continue;
    if (selection.type === "decor" && selection.index === i) continue;

    const colorData = data.colors[d.color];
    const previewUrl = colorData && colorData.preview_url;
    const dims = previewUrl ? await loadImageNaturalSize(previewUrl) : { w: 160, h: 160 };

    if (state.decors[i] !== d) continue;

    const w = dims.w * (d.scale || 1);
    const h = dims.h * (d.scale || 1);

    const box = el("div", { class: "decor-preview" });
    box.style.left = px(d.screen_position.x); box.style.top = px(d.screen_position.y);
    box.style.width = px(w); box.style.height = px(h);
    box.style.zIndex = String(10 + (d.layer || 0));
    if (d.flip_x) box.style.transform = "scaleX(-1)";
    box.appendChild(el("div", { class: "tag" }, `${d.decor} · ${d.color}`));
    if (previewUrl) {
      box.appendChild(el("img", { src: previewUrl, draggable: "false" }));
    }
    stage.appendChild(box);
  }
}

async function renderDecorOverlay() {
  const d = state.decors[selection.index];
  if (!d) return;
  const stage = document.getElementById("stage");
  document.querySelectorAll(".sprite-drag").forEach(n => n.remove());

  if (d.type === "text") {
    const box = buildTextPreviewNode(d);
    box.classList.add("sprite-drag");
    box.style.borderColor = "var(--ok)";
    box.style.zIndex = String(1000 + (d.layer || 0));
    box.appendChild(el("div", { class: "tag", style: "background:var(--ok);color:#0e1a12" },
      `texte · layer ${d.layer}` + (d.align === "center" ? " · align=center (x ignoré)" : "")));
    stage.appendChild(box);
    applyTextPreviewFont(box, d);

    makeDraggable(box, {
      onMove: (dxPx, dyPx) => {
        if (d.align !== "center") {
          d.screen_position.x = Math.round(d.screen_position.x + dxPx / scaleFactor);
          box.style.left = px(d.screen_position.x);
        }
        d.screen_position.y = Math.round(d.screen_position.y + dyPx / scaleFactor);
        box.style.top = px(d.screen_position.y);
        refreshInspector();
      }
    });
    return;
  }

  let data;
  try { data = await getDecorData(d.decor); } catch (e) { return; }
  const colorData = data.colors[d.color];
  const previewUrl = colorData && colorData.preview_url;

  const dims = previewUrl ? await loadImageNaturalSize(previewUrl) : { w: 160, h: 160 };

  // évite les doublons si l'utilisateur a changé de sélection entre-temps
  if (!(selection.type === "decor" && state.decors[selection.index] === d)) return;
  document.querySelectorAll(".sprite-drag").forEach(n => n.remove());

  const w = dims.w * (d.scale || 1);
  const h = dims.h * (d.scale || 1);

  const box = el("div", { class: "sprite-drag" });
  box.style.left = px(d.screen_position.x); box.style.top = px(d.screen_position.y);
  box.style.width = px(w); box.style.height = px(h);
  box.style.borderColor = "var(--ok)";
  box.style.zIndex = String(1000 + (d.layer || 0)); // toujours au-dessus des aperçus statiques
  if (d.flip_x) box.style.transform = "scaleX(-1)";
  box.appendChild(el("div", { class: "tag", style: "background:var(--ok);color:#0e1a12" },
    `${d.decor} · ${d.color} · layer ${d.layer} · ${Math.round(w)}×${Math.round(h)}px`));
  if (previewUrl) {
    box.appendChild(el("img", { src: previewUrl, draggable: "false" }));
  } else {
    box.appendChild(el("div", {
      style: "width:100%;height:100%;display:flex;align-items:center;justify-content:center;" +
             "color:var(--text-dim);font-size:11px;text-align:center;padding:6px;"
    }, "pas d'aperçu idle disponible pour cette couleur"));
  }
  stage.appendChild(box);

  makeDraggable(box, {
    onMove: (dxPx, dyPx) => {
      d.screen_position.x = Math.round(clamp(d.screen_position.x + dxPx / scaleFactor, -w, RES[0]));
      d.screen_position.y = Math.round(clamp(d.screen_position.y + dyPx / scaleFactor, -h, RES[1]));
      box.style.left = px(d.screen_position.x); box.style.top = px(d.screen_position.y);
      refreshInspector();
    }
  });
}

function makeDraggable(node, { onMove, onResize }) {
  node.addEventListener("mousedown", (e) => {
    const rect = node.getBoundingClientRect();
    const resizing = !!onResize && (rect.right - e.clientX < 14) && (rect.bottom - e.clientY < 14);
    let lastX = e.clientX, lastY = e.clientY;
    e.preventDefault();

    function onMouseMove(ev) {
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      lastX = ev.clientX; lastY = ev.clientY;
      if (resizing) onResize(dx, dy); else onMove(dx, dy);
    }
    function onMouseUp() {
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
    }
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  });
}

/* ============================== INSPECTEUR (panneau droit) ============================== */

function refreshInspector() { renderInspector(); }

function renderInspector() {
  const root = document.getElementById("inspectorContent");
  root.innerHTML = "";
  if (selection.type === "camera") root.appendChild(buildCameraInspector());
  else if (selection.type === "character") root.appendChild(buildCharacterInspector());
  else if (selection.type === "decor") root.appendChild(buildDecorInspector());
  else root.appendChild(el("div", { class: "placeholder" }, "Sélectionne un élément."));
}

/* ---- Caméra ---- */
function buildCameraInspector() {
  const wrap = document.createElement("div");
  wrap.appendChild(el("h3"," Keyframes caméra"));
  wrap.appendChild(el("div", { class: "hint" },
    "Chaque keyframe définit le cadrage (zoom/x/y) à un instant donné. " +
    "Fais glisser le rectangle sur le canvas pour le déplacer, ou tire son coin bas-droit pour zoomer."));

  const list = el("div", { class: "segList" });
  state.camera.timeline.forEach((kf, i) => {
    const row = el("div", { class: "seg-row" + (i === cameraKeyIndex ? " active" : "") });
    row.appendChild(el("div", { class: "lbl" },
      `t=${kf.at_second}s · zoom ${kf.zoom.toFixed(2)} · (${Math.round(kf.x)},${Math.round(kf.y)})`));
    row.appendChild(el("button", { onclick: () => { cameraKeyIndex = i; renderStage(); refreshInspector(); } }, "éditer"));
    if (state.camera.timeline.length > 1) {
      row.appendChild(el("button", {
        class: "danger", onclick: () => {
          state.camera.timeline.splice(i, 1);
          cameraKeyIndex = clamp(cameraKeyIndex, 0, state.camera.timeline.length - 1);
          renderAll();
        }
      }, "✕"));
    }
    list.appendChild(row);
  });
  wrap.appendChild(list);

  wrap.appendChild(el("button", {
    onclick: () => {
      const last = state.camera.timeline[state.camera.timeline.length - 1];
      state.camera.timeline.push({ at_second: (last ? last.at_second + 2 : 0), zoom: 1.0, x: RES[0] / 2, y: RES[1] / 2 });
      cameraKeyIndex = state.camera.timeline.length - 1;
      renderAll();
    }
  }, "+ Ajouter une keyframe"));

  const kf = state.camera.timeline[cameraKeyIndex];
  if (kf) {
    wrap.appendChild(el("h3", {}, "Keyframe sélectionnée"));
    wrap.appendChild(numberField("at_second (s)", kf.at_second, v => { kf.at_second = v; }, 0.1));
    wrap.appendChild(el("div", { class: "coord-readout" },
      `zoom ${kf.zoom.toFixed(3)}  ·  x ${Math.round(kf.x)}  ·  y ${Math.round(kf.y)}`));
    wrap.appendChild(el("div", { class: "hint" }, "zoom/x/y se règlent en manipulant le rectangle sur le canvas."));
  }

  return wrap;
}

/* ---- Personnage ---- */

  wrap.appendChild(el("h3", {}, "Personnage"));

  wrap.appendChild(labeled("id (identifiant unique)", textField(c.id, v => { c.id = v; renderElementList(); })));

    onchange: (e) => { c.position = e.target.value; renderStage(); }

    `x ${Math.round(c.screen_position.x)}  ·  y ${Math.round(c.screen_position.y)}` +

  const row = el("div", { class: "row2" });
  row.appendChild(numberField("scale", c.scale, v => { c.scale = v; renderStage(); }, 0.05));
  row.appendChild(numberField("overlay_scale", c.overlay_scale, v => { c.overlay_scale = v; }, 0.05));
  wrap.appendChild(row);

  const rowEmo = el("div", { class: "row2" });
  rowEmo.appendChild(labeled("emotions.eyes", selectField(["HAPPY", "UNHAPPY"], c.emotions.eyes, v => c.emotions.eyes = v)));
  rowEmo.appendChild(labeled("emotions.mouth", selectField(["HAPPY", "UNHAPPY"], c.emotions.mouth, v => c.emotions.mouth = v)));
  wrap.appendChild(rowEmo);

  const rowGaze = el("div", { class: "row2" });
  rowGaze.appendChild(numberField("gaze.x", c.gaze.x, v => c.gaze.x = v, 1));
  rowGaze.appendChild(numberField("gaze.y", c.gaze.y, v => c.gaze.y = v, 1));

  wrap.appendChild(el("div", { class: "check-row" }, [
    checkField("flip_x", c.flip_x, v => { c.flip_x = v; renderStage(); })

  wrap.appendChild(buildEmotionTimelineEditor(c));
  wrap.appendChild(buildMovesEditor(c));

  return wrap;
}

/* ---- Décor ---- */
function buildDecorInspector() {
  const d = state.decors[selection.index];
  const wrap = document.createElement("div");

  wrap.appendChild(el("h3", {}, "Décor"));

  const typeSelect = el("select", {
    onchange: (e) => { switchDecorType(d, e.target.value); renderAll(); }
  }, [
    el("option", { value: "image", ...(d.type !== "text" ? { selected: "selected" } : {}) }, "Image (sprite)"),
    el("option", { value: "text", ...(d.type === "text" ? { selected: "selected" } : {}) }, "Texte")
  ]);
  wrap.appendChild(labeled("type", typeSelect));

  wrap.appendChild(labeled("id (identifiant unique)", textField(d.id, v => { d.id = v; renderElementList(); })));

  if (d.type === "text") wrap.appendChild(buildTextDecorFields(d));
  else wrap.appendChild(buildImageDecorFields(d));

  wrap.appendChild(el("div", { class: "coord-readout" },
    `x ${Math.round(d.screen_position.x)}  ·  y ${Math.round(d.screen_position.y)}` +
    `  (glisse sur le canvas)` +
    (d.type === "text" && d.align === "center" ? "  ·  x ignoré (align=center)" : "")));

  const row = el("div", { class: "row2" });
  row.appendChild(numberField("scale", d.scale, v => { d.scale = v; renderStage(); }, 0.05));
  row.appendChild(numberField("layer (ordre d'empilement)", d.layer, v => d.layer = v, 1));
  wrap.appendChild(row);

  wrap.appendChild(el("div", { class: "check-row" }, [
    checkField("flip_x", d.flip_x, v => { d.flip_x = v; renderStage(); })
  ]));

  wrap.appendChild(buildEffectsEditor(d));

  wrap.appendChild(el("div", { class: "hint" },
    d.type === "text"
      ? "Un décor texte est rendu via PIL côté script (pas d'aperçu pixel-parfait ici, juste une " +
        "approximation avec la vraie police si elle est dans fonts/). \"screen_position\" = coin " +
        "haut-gauche du texte recadré, sauf align=center qui centre horizontalement et ignore x."
      : "Un décor est un élément de scène statique : pas de position animée ni d'émotion — " +
        "juste un placement, une couleur de variante et un ordre d'empilement (layer)."));

  return wrap;
}

function buildImageDecorFields(d) {
  const frag = document.createDocumentFragment();
  const decorSelect = el("select", {
    onchange: async (e) => {
      d.decor = e.target.value;
      const data = await getDecorData(d.decor);
      d.color = Object.keys(data.colors)[0] || "GREEN";
      renderAll();
    }
  }, decorsAvailable.map(n => el("option", { value: n, ...(n === d.decor ? { selected: "selected" } : {}) }, n)));
  frag.appendChild(labeled("decor", decorSelect));

  const decorData = decorCache[d.decor];
  const colors = decorData ? Object.keys(decorData.colors) : [d.color];
  const colorSelect = el("select", {
    onchange: (e) => { d.color = e.target.value; renderStage(); }
  }, colors.map(cl => el("option", { value: cl, ...(cl === d.color ? { selected: "selected" } : {}) }, cl)));
  frag.appendChild(labeled("color", colorSelect));
  return frag;
}

function colorField(rgba, onChange) {
  const wrap = document.createElement("div");
  wrap.style.display = "flex"; wrap.style.gap = "6px"; wrap.style.alignItems = "center";
  const hex = "#" + rgba.slice(0, 3).map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");
  const colorInp = el("input", { type: "color", value: hex, style: "width:44px;padding:2px;" });
  colorInp.addEventListener("input", () => {
    const v = colorInp.value;
    const r = parseInt(v.slice(1, 3), 16), g = parseInt(v.slice(3, 5), 16), b = parseInt(v.slice(5, 7), 16);
    onChange([r, g, b, rgba[3] ?? 255]);
  });
  const alphaInp = el("input", { type: "number", min: "0", max: "255", value: rgba[3] ?? 255, style: "width:60px;" });
  alphaInp.addEventListener("input", () => {
    const a = clamp(parseInt(alphaInp.value) || 0, 0, 255);
    onChange([rgba[0], rgba[1], rgba[2], a]);
  });
  wrap.appendChild(colorInp);
  wrap.appendChild(el("span", { style: "color:var(--text-dim);font-size:11px;" }, "alpha"));
  wrap.appendChild(alphaInp);
  return wrap;
}

function buildTextDecorFields(d) {
  const frag = document.createDocumentFragment();

  const textArea = document.createElement("textarea");
  textArea.rows = 3;
  textArea.style.cssText = "width:100%;font-family:inherit;font-size:12px;background:var(--panel-2);" +
    "color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 7px;resize:vertical;";
  textArea.value = d.text || "";
  textArea.addEventListener("input", () => { d.text = textArea.value; renderStage(); });
  frag.appendChild(labeled("text (saut de ligne = nouvelle ligne)", textArea));

  const fontOptions = [el("option", { value: "" }, "— police par défaut —")]
    .concat(fontsAvailable.map(f => el("option", { value: f, ...(f === d.font.file ? { selected: "selected" } : {}) }, f)));
  const fontSelect = el("select", {
    onchange: (e) => { d.font.file = e.target.value; renderStage(); }
  }, fontOptions);
  frag.appendChild(labeled("font.file (dossier fonts/)", fontSelect));

  const row = el("div", { class: "row2" });
  row.appendChild(numberField("font.size", d.font.size, v => { d.font.size = v; renderStage(); }, 1));
  row.appendChild(labeled("font.color", colorField(d.font.color, v => { d.font.color = v; renderStage(); })));
  frag.appendChild(row);

  const alignSelect = el("select", {
    onchange: (e) => { d.align = e.target.value; renderStage(); }
  }, [
    el("option", { value: "left", ...(d.align !== "center" ? { selected: "selected" } : {}) }, "left (x manuel)"),
    el("option", { value: "center", ...(d.align === "center" ? { selected: "selected" } : {}) }, "center (centré, x ignoré)")
  ]);
  frag.appendChild(labeled("align", alignSelect));

  return frag;
}

function buildActiveWindowEditor(d) {
  const wrap = document.createElement("div");
  wrap.appendChild(el("h3", {}, "Fenêtre d'activation"));
  const enabled = !!d.active_window;
  wrap.appendChild(el("div", { class: "check-row" }, [
    checkField("limiter dans le temps", enabled, v => {
      d.active_window = v ? { start_second: 0, duration_seconds: 3 } : null;
      refreshInspector();
    })
  ]));
  if (d.active_window) {
    const row = el("div", { class: "row2" });
    row.appendChild(numberField("start_second", d.active_window.start_second, v => d.active_window.start_second = v, 0.1));
    row.appendChild(numberField("duration_seconds", d.active_window.duration_seconds, v => d.active_window.duration_seconds = v, 0.1));
    wrap.appendChild(row);
    wrap.appendChild(el("div", { class: "hint" },
      "Le décor n'est visible que pendant cette fenêtre. Sans elle, il est visible sur toute la durée de l'épisode."));
  }
  return wrap;
}

function buildEffectsEditor(d) {
  const wrap = document.createElement("div");
  wrap.appendChild(el("h3", {}, "Effets"));
  wrap.appendChild(el("div", { class: "hint" },
    "Effets cumulables, relatifs au début de la fenêtre d'activation du décor (ou au début de " +
    "l'épisode si pas de fenêtre). scale = zoom in/out, fade = opacité, slide = glissement (pixels)."));

  if (!d.effects) d.effects = [];

  const list = el("div", { class: "segList" });
  d.effects.forEach((eff, ei) => {
    const isEditing = draftEffect && draftEffect.__decor === d && draftEffect.__index === ei && !draftEffect.__isNew;
    const row = el("div", { class: "seg-row" + (isEditing ? " active" : "") });
    const parts = [eff.type];
    if (eff.type === "slide") parts.push(`axis:${eff.axis}`);
    parts.push(`${eff.from} → ${eff.to}`);
    parts.push(eff.duration_seconds != null ? `${eff.duration_seconds}s` : "toute la fenêtre");
    if (eff.easing && eff.easing !== "linear") parts.push(eff.easing);
    row.appendChild(el("div", { class: "lbl" }, parts.join(" · ")));
    row.appendChild(el("button", { onclick: () => startEditEffect(d, ei) }, "éditer"));
    row.appendChild(el("button", {
      class: "danger", onclick: () => {
        d.effects.splice(ei, 1);
        if (draftEffect && draftEffect.__decor === d) draftEffect = null;
        renderAll();
      }
    }, "✕"));
    list.appendChild(row);
  });
  wrap.appendChild(list);

  wrap.appendChild(el("button", { onclick: () => startNewEffect(d) }, "+ Ajouter un effet"));

  if (draftEffect && draftEffect.__decor === d) {
    wrap.appendChild(buildEffectEditor(d));
  }

  return wrap;
}

function startNewEffect(d) {
  draftEffect = {
    __decor: d, __index: d.effects.length, __isNew: true,
    type: "fade", axis: "x", start_second: 0,
    hasDuration: false, duration_seconds: 1.0,
    from: 0.0, to: 1.0, easing: "linear"
  };
  renderAll();
}

function startEditEffect(d, index) {
  const eff = d.effects[index];
  draftEffect = {
    __decor: d, __index: index, __isNew: false,
    type: eff.type, axis: eff.axis || "x", start_second: eff.start_second ?? 0,
    hasDuration: eff.duration_seconds != null, duration_seconds: eff.duration_seconds ?? 1.0,
    from: eff.from, to: eff.to, easing: eff.easing || "linear"
  };
  renderAll();
}

function buildEffectEditor(d) {
  const e = draftEffect;
  const box = el("div", { class: "segment-editor" });
  box.appendChild(el("h4", {}, e.__isNew ? "Nouvel effet" : `Modifier effet #${e.__index + 1}`));

  const typeSelect = el("select", {
    onchange: (ev) => {
      e.type = ev.target.value;
      refreshInspector();
    }
  }, ["scale", "fade", "slide"].map(t => el("option", { value: t, ...(t === e.type ? { selected: "selected" } : {}) }, t)));
  box.appendChild(labeled("type", typeSelect));

  if (e.type === "slide") {
    const axisSelect = el("select", {
      onchange: (ev) => e.axis = ev.target.value
    }, ["x", "y"].map(a => el("option", { value: a, ...(a === e.axis ? { selected: "selected" } : {}) }, a)));
    box.appendChild(labeled("axis", axisSelect));
  }

  box.appendChild(numberField("start_second (relatif à la fenêtre du décor)", e.start_second, v => e.start_second = v, 0.1));

  box.appendChild(el("div", { class: "check-row" }, [
    checkField("durée définie (sinon = toute la fenêtre active)", e.hasDuration, v => { e.hasDuration = v; refreshInspector(); })
  ]));
  if (e.hasDuration) {
    box.appendChild(numberField("duration_seconds", e.duration_seconds, v => e.duration_seconds = v, 0.1));
  }

  const row = el("div", { class: "row2" });
  row.appendChild(numberField("from", e.from, v => e.from = v, 0.05));
  row.appendChild(numberField("to", e.to, v => e.to = v, 0.05));
  box.appendChild(row);

  const easingSelect = el("select", {
    onchange: (ev) => e.easing = ev.target.value
  }, ["linear", "ease_out_cubic", "ease_in_cubic"].map(x => el("option", { value: x, ...(x === e.easing ? { selected: "selected" } : {}) }, x)));
  box.appendChild(labeled("easing", easingSelect));

  box.appendChild(el("div", { class: "btnbar" }, [
    el("button", { onclick: () => { draftEffect = null; renderAll(); } }, "Annuler"),
    el("button", {
      class: "primary", onclick: () => {
        const payload = { type: e.type, from: e.from, to: e.to, start_second: e.start_second, easing: e.easing };
        if (e.type === "slide") payload.axis = e.axis;
        payload.duration_seconds = e.hasDuration ? e.duration_seconds : null;
        if (e.__isNew) d.effects.push(payload);
        else d.effects[e.__index] = payload;
        draftEffect = null;
        renderAll();
      }
    }, "Enregistrer l'effet")
  ]));

  return box;
}

function buildMovesEditor(c) {
  const wrap = document.createElement("div");
  wrap.appendChild(el("h3", {}, "Mouvements (moves)"));
  wrap.appendChild(el("div", { class: "hint" },
    "Un mouvement se déclenche à un instant (at_second) et contient une séquence de segments " +
    "(changements de position). Le premier segment part de l'état courant du personnage."));

  c.moves.forEach((mv, mi) => wrap.appendChild(buildMoveBlock(c, mv, mi)));

  wrap.appendChild(el("button", {
    onclick: () => {
      c.moves.push({ at_second: 2.0, transition_fps: 8, move_fps: 10, segments: [] });
      renderAll();
    }
  }, "+ Ajouter un mouvement"));

  return wrap;
}

function buildEmotionTimelineEditor(c) {
  const wrap = document.createElement("div");
  wrap.appendChild(el("h3", {}, "Emotion timeline"));
  wrap.appendChild(el("div", { class: "hint" },
    "Change les émotions (eyes/mouth) du personnage à des instants précis, en plus de son état " +
    "initial ci-dessus. Chaque keyframe est indépendante : elle peut ne changer que eyes, que mouth, ou les deux."));

  if (!c.emotion_timeline) c.emotion_timeline = [];

  const list = el("div", { class: "segList" });
  const sorted = c.emotion_timeline.slice().sort((a, b) => a.at_second - b.at_second);
  sorted.forEach((ek) => {
    const ei = c.emotion_timeline.indexOf(ek);
    const isEditing = draftEmotion && draftEmotion.__character === c && draftEmotion.__index === ei && !draftEmotion.__isNew;
    const row = el("div", { class: "seg-row" + (isEditing ? " active" : "") });
    const parts = [`t=${ek.at_second}s`];
    if (ek.eyes) parts.push(`eyes:${ek.eyes}`);
    if (ek.mouth) parts.push(`mouth:${ek.mouth}`);
    row.appendChild(el("div", { class: "lbl" }, parts.join(" · ")));
    row.appendChild(el("button", { onclick: () => startEditEmotionKeyframe(c, ei) }, "éditer"));
    row.appendChild(el("button", {
      class: "danger", onclick: () => {
        c.emotion_timeline.splice(ei, 1);
        if (draftEmotion && draftEmotion.__character === c) draftEmotion = null;
        renderAll();
      }
    }, "✕"));
    list.appendChild(row);
  });
  wrap.appendChild(list);

  wrap.appendChild(el("button", { onclick: () => startNewEmotionKeyframe(c) }, "+ Ajouter une keyframe émotion"));

  if (draftEmotion && draftEmotion.__character === c) {
    wrap.appendChild(buildEmotionKeyframeEditor(c));
  }

  return wrap;
}

function startNewEmotionKeyframe(c) {
  const last = c.emotion_timeline[c.emotion_timeline.length - 1];
  draftEmotion = {
    __character: c, __index: c.emotion_timeline.length, __isNew: true,
    at_second: last ? last.at_second + 1 : 0,
    hasEyes: false, eyes: c.emotions.eyes || "HAPPY",
    hasMouth: false, mouth: c.emotions.mouth || "HAPPY"
  };
  renderAll();
}

function startEditEmotionKeyframe(c, index) {
  const ek = c.emotion_timeline[index];
  draftEmotion = {
    __character: c, __index: index, __isNew: false,
    at_second: ek.at_second,
    hasEyes: !!ek.eyes, eyes: ek.eyes || "HAPPY",
    hasMouth: !!ek.mouth, mouth: ek.mouth || "HAPPY"
  };
  renderAll();
}

function buildEmotionKeyframeEditor(c) {
  const d = draftEmotion;
  const box = el("div", { class: "segment-editor" });
  box.appendChild(el("h4", {}, d.__isNew ? "Nouvelle keyframe émotion" : `Modifier keyframe #${d.__index + 1}`));

  box.appendChild(numberField("at_second", d.at_second, v => d.at_second = v, 0.1));

  box.appendChild(el("div", { class: "check-row" }, [
    checkField("définir eyes", d.hasEyes, v => { d.hasEyes = v; refreshInspector(); })
  ]));
  if (d.hasEyes) {
    box.appendChild(labeled("eyes", selectField(["HAPPY", "UNHAPPY"], d.eyes, v => d.eyes = v)));
  }

  box.appendChild(el("div", { class: "check-row" }, [
    checkField("définir mouth", d.hasMouth, v => { d.hasMouth = v; refreshInspector(); })
  ]));
  if (d.hasMouth) {
    box.appendChild(labeled("mouth", selectField(["HAPPY", "UNHAPPY"], d.mouth, v => d.mouth = v)));
  }
  if (!d.hasEyes && !d.hasMouth) {
    box.appendChild(el("div", { class: "hint" }, "Coche au moins une des deux cases avant d'enregistrer."));
  }

  box.appendChild(el("div", { class: "btnbar" }, [
    el("button", { onclick: () => { draftEmotion = null; renderAll(); } }, "Annuler"),
    el("button", {
      class: "primary", onclick: () => {
        if (!d.hasEyes && !d.hasMouth) { alert("Définis au moins eyes ou mouth."); return; }
        const payload = { at_second: d.at_second };
        if (d.hasEyes) payload.eyes = d.eyes;
        if (d.hasMouth) payload.mouth = d.mouth;
        if (d.__isNew) c.emotion_timeline.push(payload);
        else c.emotion_timeline[d.__index] = payload;
        draftEmotion = null;
        renderAll();
      }
    }, "Enregistrer la keyframe")
  ]));

  return box;
}

function buildMoveBlock(c, mv, mi) {
  const block = el("div", { class: "move-block" });
  const head = el("div", { class: "move-head" }, [
    el("b", {}, `Move #${mi + 1}`),
    el("button", { class: "danger", onclick: () => { c.moves.splice(mi, 1); draftSegment = null; renderAll(); } }, "supprimer")
  ]);
  block.appendChild(head);

  const row = el("div", { class: "row3" });
  row.appendChild(numberField("at_second", mv.at_second, v => mv.at_second = v, 0.1));
  row.appendChild(numberField("transition_fps", mv.transition_fps, v => mv.transition_fps = v, 1));
  row.appendChild(numberField("move_fps", mv.move_fps, v => mv.move_fps = v, 1));
  block.appendChild(row);

  const segList = el("div", { class: "segList" });
  mv.segments.forEach((seg, si) => {
    const isEditing = draftSegment && draftSegment.__move === mv && draftSegment.__index === si;
    const row = el("div", { class: "seg-row" + (isEditing ? " active" : "") });
    row.appendChild(el("div", { class: "lbl" },
      `#${si + 1} pos ${seg.position} → (${Math.round(seg.to.x)},${Math.round(seg.to.y)})` +
      (seg.gaze ? ` · gaze(${seg.gaze.x},${seg.gaze.y})` : "") +
      (seg.skip_transition ? " · skip_transition" : "") + (seg.reverse ? " · reverse" : "")));
    row.appendChild(el("button", { onclick: () => startEditSegment(c, mv, si) }, "éditer"));
    row.appendChild(el("button", {
      class: "danger", onclick: () => { mv.segments.splice(si, 1); draftSegment = null; renderAll(); }
    }, "✕"));
    segList.appendChild(row);
  });
  block.appendChild(segList);

  block.appendChild(el("button", { onclick: () => startNewSegment(c, mv) }, "+ Ajouter un segment"));

  if (draftSegment && draftSegment.__move === mv) {
    block.appendChild(buildSegmentEditor(c, mv));
  }

  return block;
}

function previousToPoint(c, mv, beforeIndex) {
  if (beforeIndex > 0) return { ...mv.segments[beforeIndex - 1].to };
  return { ...c.screen_position };
}

function startNewSegment(c, mv) {
  const from = previousToPoint(c, mv, mv.segments.length);
  const posData = characterCache[c.character];
  const positions = posData ? Object.keys(posData.positions) : [c.position];
  draftSegment = {
    __move: mv, __index: mv.segments.length, // null tant que non enregistré (nouveau)
    __isNew: true,
    position: positions[0] || c.position,
    from: { x: from.x, y: from.y },
    to: { x: from.x, y: from.y },
    duration_seconds: 1.5,
    skip_transition: false,
    reverse: false,
    flip_x: c.flip_x,
    hasGaze: false,
    gaze: { x: 0, y: 0 }
  };
  renderAll();
}

function startEditSegment(c, mv, si) {
  const seg = mv.segments[si];
  const hasGaze = !!(seg.gaze && typeof seg.gaze === "object");
  draftSegment = {
    __move: mv, __index: si, __isNew: false,
    position: seg.position,
    from: { ...seg.from }, to: { ...seg.to },
    duration_seconds: seg.duration_seconds,
    skip_transition: !!seg.skip_transition,
    reverse: !!seg.reverse,
    flip_x: !!seg.flip_x,
    hasGaze,
    gaze: { ...(hasGaze ? seg.gaze : { x: 0, y: 0 }) }
  };
  renderAll();
}

function buildSegmentEditor(c, mv) {
  const d = draftSegment;
  const box = el("div", { class: "segment-editor" });
  box.appendChild(el("h4", {}, d.__isNew ? "Nouveau segment" : `Modifier segment #${d.__index + 1}`));

  const posData = characterCache[c.character];
  const positions = posData ? Object.keys(posData.positions) : [c.position];
  const posSelect = el("select", {
    onchange: (e) => { d.position = e.target.value; renderStage(); }
  }, positions.map(p => el("option", { value: p, ...(p === d.position ? { selected: "selected" } : {}) }, "position " + p)));
  box.appendChild(labeled("position", posSelect));

  box.appendChild(el("div", { class: "coord-readout" },
    `from (${Math.round(d.from.x)}, ${Math.round(d.from.y)})  →  to (${Math.round(d.to.x)}, ${Math.round(d.to.y)})`));
  box.appendChild(el("div", { class: "hint" }, "Glisse le sprite sur le canvas pour définir le point d'arrivée (to)."));

  box.appendChild(numberField("duration_seconds", d.duration_seconds, v => d.duration_seconds = v, 0.1));

  box.appendChild(el("div", { class: "check-row" }, [
    checkField("définir gaze", d.hasGaze, v => { d.hasGaze = v; refreshInspector(); })
  ]));
  if (d.hasGaze) {
    const rowGaze = el("div", { class: "row2" });
    rowGaze.appendChild(numberField("gaze.x", d.gaze.x, v => d.gaze.x = v, 1));
    rowGaze.appendChild(numberField("gaze.y", d.gaze.y, v => d.gaze.y = v, 1));
    box.appendChild(rowGaze);
  } else {
    box.appendChild(el("div", { class: "hint" }, "gaze non défini pour ce segment (clé absente à l'export)."));
  }

  box.appendChild(el("div", { class: "check-row" }, [
    checkField("flip_x", d.flip_x, v => d.flip_x = v),
    checkField("reverse", d.reverse, v => d.reverse = v),
    checkField("skip_transition", d.skip_transition, v => d.skip_transition = v),
  ]));

  box.appendChild(el("div", { class: "btnbar" }, [
    el("button", { onclick: () => { draftSegment = null; renderAll(); } }, "Annuler"),
    el("button", {
      class: "primary", onclick: () => {
        const payload = {
          position: d.position, from: { ...d.from }, to: { ...d.to },
          duration_seconds: d.duration_seconds, skip_transition: d.skip_transition,
          reverse: d.reverse, flip_x: d.flip_x
        };
        if (d.hasGaze) payload.gaze = { ...d.gaze };
        if (d.__isNew) mv.segments.push(payload);
        else mv.segments[d.__index] = payload;
        draftSegment = null;
        renderAll();
      }
    }, "Enregistrer le segment")
  ]));

  return box;
}

/* ---- petits helpers de champ ---- */
function labeled(labelText, node) {
  const wrap = el("label", { class: "field" });
  wrap.appendChild(el("span", {}, labelText));
  wrap.appendChild(node);
  return wrap;
}
function numberField(labelText, value, onChange, step) {
  const inp = el("input", { type: "number", step: step || "any", value });
  inp.addEventListener("input", () => onChange(parseFloat(inp.value) || 0));
  return labeled(labelText, inp);
}
function textField(value, onChange) {
  const inp = el("input", { type: "text", value: value || "" });
  inp.addEventListener("input", () => onChange(inp.value));
  return inp;
}
function selectField(options, value, onChange) {
  const sel = el("select", {}, options.map(o => el("option", { value: o, ...(o === value ? { selected: "selected" } : {}) }, o)));
  sel.addEventListener("change", () => onChange(sel.value));
  return sel;
}
function checkField(labelText, checked, onChange) {
  const inp = el("input", { type: "checkbox" });
  inp.checked = !!checked;
  inp.addEventListener("change", () => onChange(inp.checked));
  const lbl = el("label", {}, [inp, document.createTextNode(" " + labelText)]);
  return lbl;
}

/* ============================== GÉNÉRATION / SAUVEGARDE ============================== */

function cleanExportDecors(rawDecors) {
  return rawDecors.map(d => {
    const out = { ...d };
    if (!out.active_window) delete out.active_window;
    if (Array.isArray(out.effects)) {
      if (out.effects.length === 0) delete out.effects;
      else {
        out.effects = out.effects.map(eff => {
          const e2 = { ...eff };
          if (e2.duration_seconds === null || e2.duration_seconds === undefined) delete e2.duration_seconds;
          return e2;
        });
      }
    } else {
      delete out.effects;
    }
    return out;
  });
}

function buildExportPayload() {
  // clone profond + nettoyage des clés internes/optionnelles utilisées par l'UI
  const out = JSON.parse(JSON.stringify(state));
  out.output.resolution = [RES[0], RES[1]];
  out.decors = cleanExportDecors(out.decors);
  return out;
}

document.getElementById("btnGenerate").addEventListener("click", () => {
  const modal = document.getElementById("saveModal");
  const defaultName = (state.episode_id || "episode") + "-settings.json";
  document.getElementById("saveFilename").value = defaultName;
  modal.classList.remove("hidden");
});
document.getElementById("saveCancel").addEventListener("click", () => {
  document.getElementById("saveModal").classList.add("hidden");
});
document.getElementById("saveConfirm").addEventListener("click", async () => {
  const filename = document.getElementById("saveFilename").value.trim();
  if (!filename) return;
  try {
    const res = await api("/api/save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename, data: buildExportPayload() })
    });
    setStatus("Enregistré → " + res.path);
    document.getElementById("saveModal").classList.add("hidden");
  } catch (e) {
    setStatus("Erreur d'enregistrement: " + e.message);
  }
});

/* ============================== RENDER GLOBAL ============================== */

function renderAll() {
  renderElementList();
  renderStage();
  renderInspector();
}

/* ============================== INIT ============================== */

rebuildStageSize();
bindTopbar();
loadInitialData();
</script>
</body>
</html>
